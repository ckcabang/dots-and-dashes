# Gate every pull request on `make check`: mypy, then the unit, integration
# and browser suites against the test Compose stack (Postgres + app container),
# then one run of the canary script (monitoring/canary.js) against that stack.
# It also runs on main, because a pull request can only restore caches saved
# by itself or by main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on main saves no cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2  # publishes no floating major tag

      # The lockfile pins Playwright, and so the Chromium build it downloads.
      - name: Cache Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      # `make setup`, plus the system libraries headless Chromium needs.
      # Not `playwright install-deps chromium`: it always adds Playwright's
      # "tools" group too (xvfb and large CJK, Thai and Unifont fonts), and it
      # has no `--only-shell` to drop them. The test pages are English text.
      # The list is the `chromium` group of `ubuntu24.04-x64` in Playwright's
      # nativeDeps (in the pinned 1.64.1: playwright/driver/package/lib/
      # coreBundle.js), plus fontconfig, freetype and one font from "tools".
      # Revisit it when Playwright is upgraded or ubuntu-latest moves on.
      # --no-upgrade keeps the runner image's copies instead of downloading
      # newer ones from a sometimes-slow mirror.
      - name: Install dependencies
        run: |
          make setup
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --no-upgrade \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 \
            libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 \
            libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 \
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxkbcommon0 libxrandr2 \
            libfontconfig1 libfreetype6 fonts-liberation

      - name: Typecheck and test
        run: make check

      - uses: grafana/setup-k6-action@v1.2.2
        with:
          k6-version: 2.3.0

      # The canary script Synthetic Monitoring runs against prod, once, against
      # the test stack `make check` left running, as a Canary User of its own.
      # The project name and port lookup are the Makefile's TEST_PROJECT and
      # test_port: keep them in step.
      - name: Run the canary once against the test stack
        run: |
          export COMPOSE_PROJECT_NAME="dots-and-dashes-test-$(printf '%s' "$PWD" | cksum | cut -d' ' -f1)"
          export DB_PORT=0 APP_PORT=0 FLAG_MONTHLY_REVIEW=on
          CANARY_PASSWORD=$(openssl rand -hex 24)
          export CANARY_PASSWORD
          docker compose exec -T -e CANARY_PASSWORD app dots-and-dashes create-user \
            --canary --email canary@dots-and-dashes.invalid --timezone UTC \
            --password-env CANARY_PASSWORD
          secrets="$RUNNER_TEMP/canary.secrets"
          (umask 077 && printf 'canary-password=%s\n' "$CANARY_PASSWORD" > "$secrets")
          k6 run --secret-source="file=$secrets" \
            -e BASE_URL="http://localhost:$(docker compose port app 8000 | sed 's/.*://')" \
            monitoring/canary.js

      - name: Show test stack logs
        if: failure()
        run: make test-logs
