# Keep dev on main: every merge builds an image tagged with the commit on Fly's
# remote builder, pushes it to registry.fly.io/dots-and-dashes-dev, then
# deploys that image to the dev app. The release command (fly.dev.toml) runs
# the Alembic migrations first. One-time setup is scripts/provision-dev.
name: Deploy to dev
run-name: "Deploy ${{ inputs.ref || github.sha }} to dev"

on:
  push:
    branches: [main]
  # Redeploy main by hand, e.g. after changing a Fly secret. With a ref, it
  # builds and deploys that branch, tag or commit instead, with main's copy of
  # this workflow: how a bad deploy is staged on dev without merging it
  # (docs/runbooks/README.md#bad-deploy--roll-back). Prod never runs such an
  # image: deploy-prod.yml refuses a commit that isn't on main.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy instead of main (stages a bad deploy)
        required: false
        default: ""
        type: string

# One deploy at a time, in merge order; never cancel one mid-release.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A deploy token scoped to dots-and-dashes-dev.
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The image is tagged with the commit it is built from.
      - name: Name the commit
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Build and push the image
        run: flyctl deploy --config fly.dev.toml --remote-only --build-only --push --image-label "$SHA"

      - name: Deploy it to dev
        run: flyctl deploy --config fly.dev.toml --image "registry.fly.io/dots-and-dashes-dev:$SHA"

      # The run's own proof the deploy serves: retries cover an idle Machine starting.
      - name: Smoke-test dev
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://dots-and-dashes-dev.fly.dev/login
