services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dots
      POSTGRES_PASSWORD: dots
      POSTGRES_DB: dots_and_dashes
    ports:
      # Loopback only: the superuser login is in this file.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dots -d dots_and_dashes"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://dots:dots@db:5432/dots_and_dashes
      SESSION_SECRET: ${SESSION_SECRET:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      FLAG_MONTHLY_REVIEW: ${FLAG_MONTHLY_REVIEW:-}
      # The local User's password, as the README states. Compose only: Fly never runs this.
      LOCAL_USER_PASSWORD: dots-and-dashes
    command: >-
      sh -c "alembic upgrade head &&
      dots-and-dashes create-user --if-missing --email me@example.com
      --timezone ${LOCAL_USER_TIMEZONE:-UTC} --password-env LOCAL_USER_PASSWORD &&
      exec uvicorn dots_and_dashes.web:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
