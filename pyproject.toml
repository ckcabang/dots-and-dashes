[project]
name = "dots-and-dashes"
version = "0.1.0"
description = "A personal, keyboard-first bullet journal"
readme = "README.md"
authors = [
    { name = "Clarence Cabang", email = "ckcabang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dots-and-dashes = "dots_and_dashes.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<2.14",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.2",
    "shellcheck-py>=0.11.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.mypy]
files = ["src", "tests", "migrations"]
explicit_package_bases = true
mypy_path = ["src", "."]

[tool.ruff]
line-length = 100
# The On-call agent's tools: Python scripts without a .py extension.
extend-include = ["scripts/on-call/*"]

[tool.ruff.lint]
# Pinned here so CI and every machine lint the same way, whatever ruff config a user has.
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these.
"migrations/versions/*" = ["E501"]
