<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dots & Dashes{% endblock %}</title>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/keyboard.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    input[name="text"] { width: 100%; font-size: 1.1rem; padding: 0.5rem; box-sizing: border-box; }
    .entries { list-style: none; padding: 0; }
    .entry { padding: 0.25rem 0; }
    .state-marker { display: inline-block; width: 1.5rem; }
    .entry--nested { padding-left: 1.5rem; }
    .entry:focus { outline: none; background: #eef; }
    .entry--cancelled .entry-text { text-decoration: line-through; color: #777; }
    .entry--migrated .entry-text, .entry--scheduled .entry-text { color: #777; }
    .migration-count { color: #a50; font-size: 0.85em; }
    .entry input { font: inherit; width: 100%; box-sizing: border-box; }
    .day-nav { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .login label { display: block; margin: 0.5rem 0; }
    .logout { text-align: right; }
  </style>
</head>
<body{% if today is defined %} data-today="{{ today.isoformat() }}"{% endif %}>
  {% if today is defined %}
  <form method="post" action="/logout" class="logout"><button>Log out</button></form>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
